<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/renova.svg" />
    <!-- Icona per «Aggiungi a schermata Home»: iOS non accetta SVG né
         trasparenza (la riempirebbe di nero) → PNG su fondo bianco in
         public/icone/; Android la prende dal manifest. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icone/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="renova" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fafaf8" />
    <!-- 2A · Neutral (Helvetica): l'UI usa Helvetica di sistema; l'unico font
         caricato è Bricolage Grotesque per il logo "renova". È self-hosted
         (@font-face in src/index.css): nessuna richiesta a Google, così l'IP
         degli utenti non lascia il nostro dominio (GDPR). -->
    <meta name="description" content="renova è la piattaforma che rimette in circolo il materiale sportivo ancora buono: i tesserati di ASD e SSD se lo scambiano gratuitamente, e ogni scambio misura il risparmio economico e l'impatto ambientale evitato (CO2 e acqua)." />
    <title>renova — Economia circolare digitale per lo sport dilettantistico</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
