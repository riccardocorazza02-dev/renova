name: Deploy su GitHub Pages

# Pubblica ad ogni push sul branch principale.
on:
  push:
    branches: [main]
  workflow_dispatch: # permette anche l'avvio manuale dalla tab Actions

# Permessi necessari a GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Evita deploy sovrapposti: l'ultimo push vince.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installa dipendenze
        run: npm ci

      # Dominio custom servito sulla radice → base '/'.
      #
      # Questo stesso workflow gira in DUE repository (vedi README, «Landing e
      # app su due domini»): `renova` pubblica la landing su renovasport.it,
      # `renova-app` pubblica la stessa build su app.renovasport.it. A
      # distinguerli sono solo le variabili di repo (Settings → Secrets and
      # variables → Actions → Variables), non il codice:
      #
      #   • PAGES_DOMAIN → dominio custom di QUESTO sito Pages
      #     (vuota = renovasport.it; nel repo dell'app: app.renovasport.it);
      #   • VITE_APP_URL → dove vive l'app (https://app.renovasport.it).
      #     Va impostata in ENTRAMBI i repo: alla landing serve per aprire
      #     l'app in una nuova scheda, all'app per riconoscere il proprio
      #     dominio e portare alla radice il login invece della landing.
      #     Finché non esiste, «Accedi» resta la rotta interna /login — così
      #     non si pubblica un link verso un dominio non ancora attivo.
      - name: Build
        env:
          VITE_BASE: /
          VITE_APP_URL: ${{ vars.VITE_APP_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_STORAGE_BUCKET: ${{ secrets.VITE_SUPABASE_STORAGE_BUCKET }}
        run: npm run build

      # Il dominio custom va riscritto a ogni deploy, altrimenti Pages lo
      # dimentica. `public/CNAME` (renovasport.it) resta il default del repo
      # della landing; il repo dell'app lo sovrascrive con PAGES_DOMAIN.
      - name: Dominio custom (CNAME)
        run: |
          echo "${{ vars.PAGES_DOMAIN || 'renovasport.it' }}" > dist/CNAME
          echo "CNAME = $(cat dist/CNAME)"

      - name: Carica artifact per Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
